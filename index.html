<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Рабочий кабинет</title>
  <meta name="description" content="Личный рабочий кабинет: таймер задач, статистика, фоновые звуки, карточки для языков и цели хобби.">
  <meta name="theme-color" content="#fcf8fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15131f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Тема ставится сразу, чтобы страница не «мигала» светлым.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('study-workspace-v1') || '{}');
        var t = s.settings && s.settings.theme;
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon" data-icon="sparkles"></span><span>Рабочий кабинет</span></div>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home"><span class="ni" data-icon="clock"></span><span class="nl">Сегодня</span></a>
        <a href="#/plan" data-route="plan"><span class="ni" data-icon="calendar"></span><span class="nl">План</span></a>
        <a href="#/calendar" data-route="calendar"><span class="ni" data-icon="star"></span><span class="nl" data-short="Месяц">Календарь</span></a>
        <a href="#/stats" data-route="stats"><span class="ni" data-icon="chart"></span><span class="nl" data-short="Стат.">Статистика</span></a>
        <a href="#/cards" data-route="cards"><span class="ni" data-icon="cards"></span><span class="nl">Языки</span></a>
        <a href="#/hobby" data-route="hobby"><span class="ni" data-icon="palette"></span><span class="nl">Хобби</span></a>
        <a href="#/mind" data-route="mind"><span class="ni" data-icon="heart"></span><span class="nl" data-short="Чувства">Самочувствие</span></a>
        <a href="#/settings" data-route="settings"><span class="ni" data-icon="settings"></span><span class="nl" data-short="Ещё">Настройки</span></a>
      </nav>
      <div class="sidebar-foot" id="sidebar-streak"></div>
    </aside>

    <main class="main">
      <div id="topbar" class="topbar"></div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Нижняя панель: мини-таймер и плеер. Она не перерисовывается при смене раздела. -->
  <div class="dock" id="dock">
    <div class="dock-timer" id="dock-timer" hidden></div>
    <div class="player" id="player">
      <button class="icon-btn play-btn" id="player-toggle" title="Включить/выключить звук" aria-label="Включить или выключить звук"></button>
      <button class="player-info" id="player-open" title="Открыть микшер звуков">
        <span class="player-title" id="player-title">Фоновые звуки</span>
        <span class="player-sub" id="player-sub">нажми, чтобы выбрать</span>
      </button>
      <input type="range" class="player-vol" id="player-vol" min="0" max="1" step="0.01" aria-label="Общая громкость">
      <button class="icon-btn" id="player-mixer" title="Микшер" aria-label="Открыть микшер" data-icon="settings"></button>
    </div>
    <div class="mixer" id="mixer" hidden></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/stats-data.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/game.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/plan.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/cards.js"></script>
  <script src="js/views/read.js"></script>
  <script src="js/content/grammar.js"></script>
  <script src="js/content/grammar2.js"></script>
  <script src="js/content/placement.js"></script>
  <script src="js/content/library.js"></script>
  <script src="js/content/library-quiz.js"></script>
  <script src="js/content/library2.js"></script>
  <script src="js/content/library3.js"></script>
  <script src="js/content/vocab.js"></script>
  <script src="js/views/lessons.js"></script>
  <script src="js/views/theory.js"></script>
  <script src="js/views/hobby.js"></script>
  <script src="js/views/mind.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
